spring.application.name=myurlshortner-consumer
server.port=7070

# r2dbc:driver[:protocol]://[user:password@]host[:port][/path][?option=value].
app.datasource.url=r2dbc:postgresql://postgres:safetypassword@localhost:5432/postgres

# Kafka Properties
app.kafka.bootstrap-servers=localhost:9092
app.kafka.consumer.group-id=myurlshortner-consumer
app.kafka.consumer.client-id=myurlshortner-consumer
app.kafka.consumer.user-events.apicurio.registry.url=http://localhost:8901/apis/registry/v3
app.kafka.consumer.topic-name=shortened-url-events
app.kafka.consumer.enabled=true

app.podname=local
app.be.baseurl=http://localhost:8080
app.be.apikey=${API_KEY:safetypassword}

logging.pattern.console=%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.30t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
logging.level.com.acme.myurlshortner.consumer.application.kafka.consumer.ShortenedUrlUserEventsReactiveConsumer=debug
logging.level.com.acme.myurlshortner.consumer.application.kafka.retry.ShortenedUrlUserEventsRetry=debug